
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**

        - id: employee-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/employees/**

        - id: attendance-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/attendance/**

        - id: leave-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/leaves/**

        - id: performance-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/performance/**

        
        - id: recruitment-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/recruitment/**

        - id: payroll-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/payroll/**

        - id: ai-insights-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/ai-insights/**

logging:
  level:
    org.springframework.security: DEBUG